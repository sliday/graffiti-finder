[project]
name = "krakow-clean"
version = "0.1.0"
description = "Autonomous graffiti detector + reporter for Krakow (Survey123)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx[http2]>=0.27",
    "pillow>=10.4",
    "piexif>=1.1.3",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.46",
    "accelerate>=0.34",
    "playwright>=1.47",
    "pyproj>=3.6",
    "imagehash>=4.3",
    "tqdm>=4.66",
]

[project.scripts]
krakow-clean = "krakow_clean.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krakow_clean"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
